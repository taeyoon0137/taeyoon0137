name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.8.14"
          cache: true
          github_token: ${{ github.token }}

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          YARN_BIN="$(mise which yarn)" node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const { packageManager } = require("./package.json");

          const expected = /^yarn@4\.18\.0\+sha512\.([a-f0-9]{128})$/.exec(
            packageManager,
          );
          if (!expected) {
            throw new Error("Yarn version metadata is out of sync");
          }

          const actual = createHash("sha512")
            .update(readFileSync(process.env.YARN_BIN))
            .digest("hex");
          if (actual !== expected[1]) {
            throw new Error("Yarn artifact checksum does not match packageManager");
          }
          NODE
          test "$(yarn --version)" = "4.18.0"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn run lint

      - name: Audit high-severity vulnerabilities
        run: yarn npm audit --all --recursive --severity high

      - name: Check release plan
        id: release-plan
        run: |
          STATUS_FILE="$RUNNER_TEMP/changeset-status.json"

          if ! yarn changeset status --output "$STATUS_FILE"; then
            if find .changeset -maxdepth 1 -name '*.md' -print -quit | grep -q .; then
              exit 1
            fi

            printf '{"releases":[]}\n' > "$STATUS_FILE"
          fi

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const status = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/changeset-status.json`, "utf8"),
          );
          const hasReleases = status.releases.length > 0;

          process.stdout.write(`has_releases=${hasReleases}\n`);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `has_releases=${hasReleases}\n`,
          );
          NODE

      - name: Apply release versions
        if: steps.release-plan.outputs.has_releases == 'true'
        run: |
          yarn changeset version
          yarn install
          yarn run readme

      - name: Commit, tag, and push release
        if: steps.release-plan.outputs.has_releases == 'true'
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json yarn.lock .pnp.cjs .pnp.loader.mjs CHANGELOG.md .changeset README.md resources/readme-hero.svg
          git commit -m "Chore: Release v${VERSION}"
          yarn changeset git-tag

          if ! git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "Changesets did not create refs/tags/${TAG}" >&2
            exit 1
          fi

          if [ "$(git rev-list -n 1 "refs/tags/${TAG}")" != "$(git rev-parse HEAD)" ]; then
            echo "refs/tags/${TAG} does not point to HEAD" >&2
            exit 1
          fi

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          cat > "$ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$GITHUB_TOKEN" ;;
          esac
          SH
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          git push --atomic \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/main \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          rm -f "$ASKPASS"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check for a missing GitHub release
        if: steps.release-plan.outputs.has_releases != 'true'
        id: reconcile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if ! git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" HEAD; then
            echo "refs/tags/${TAG} is not an ancestor of main" >&2
            exit 1
          fi

          TAG_VERSION="$(
            git show "refs/tags/${TAG}:package.json" |
              node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version'
          )"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "refs/tags/${TAG} contains package version ${TAG_VERSION}, expected ${VERSION}" >&2
            exit 1
          fi

          STATUS="$(curl \
            --location \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

          case "$STATUS" in
            200)
              echo "create_release=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "create_release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "GitHub Releases API returned HTTP ${STATUS}" >&2
              exit 1
              ;;
          esac

      - name: Create GitHub release
        if: >-
          steps.release-plan.outputs.has_releases == 'true' ||
          steps.reconcile.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v${VERSION}"

          awk -v header="## ${VERSION}" '
            $0 == header {
              found = 1
            }
            found && /^## / && $0 != header {
              if (found) exit
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "Could not find CHANGELOG notes for ${TAG}" >&2
            exit 1
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
